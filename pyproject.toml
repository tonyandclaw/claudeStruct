[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudestruct"
version = "0.1.0"
description = "Token-efficient Claude Code companion for dev, review, planning, and debugging"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "claudestruct" }]
dependencies = [
  "anthropic>=0.40.0",
  "click>=8.1.0",
  "rich>=13.7.0",
  "pathspec>=0.12.0",
  # MCP server mode (`cs mcp`). The SDK is loaded lazily — only the
  # `cs mcp` subcommand triggers the import — but the dep is hard so
  # the wire-into-Claude-Code workflow is one `pip install -e .` away.
  "mcp>=1.0.0",
]

[project.optional-dependencies]
# `cs serve` and the daemon-mode REST API + RBAC layer (W6.2 + W6.3).
# Kept out of the base install so `pip install claudestruct` stays lean.
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  # AES-GCM envelope encryption for W8.6 CMEK + general at-rest crypto.
  # The library is a hard dep of the server bundle because every
  # daemon write path will call into it once envelope-encryption is
  # turned on for an org -- lazy-loading would just defer the pip
  # install, not the import cost.
  "cryptography>=42.0",
  # Alembic for schema migrations (W6.3). `cs serve migrate` and the
  # test_alembic suite both import alembic.config; a hard dep here
  # keeps the lean install path off the server bundle.
  "alembic>=1.13",
]
# `pip install claudestruct[otel]` to enable OpenTelemetry tracing.
# Without this extra, tracing.py falls back to no-op spans and prints
# a single warning when OTEL_EXPORTER_OTLP_ENDPOINT is set anyway.
otel = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
# `pip install claudestruct[sentry]` for opt-in error reporting.
sentry = [
  "sentry-sdk>=2.0.0",
]
# `pip install claudestruct[openai]` to enable the OpenAI-compat
# provider (W10.1). Targets local servers (Ollama / vLLM / SGLang /
# llama.cpp) plus cloud OpenAI; selected at runtime via
# CLAUDESTRUCT_PROVIDER=openai. tiktoken is included so the dry-run
# token counter is accurate against models with known tokenizers.
openai = [
  "openai>=1.50.0",
  "tiktoken>=0.7.0",
]
# `pip install claudestruct[smart-context]` enables `cs index build`
# + the `--smart-context` flag (W10.5). The index module itself uses
# only stdlib (sqlite3 + urllib + json), so this extra is empty
# today — declared so the docs can point users at a stable install
# command and so a future sqlite-vec / hnswlib upgrade can land here
# without breaking any existing pin.
smart-context = []
# `pip install claudestruct[voice]` enables `cs voice transcribe` /
# `cs voice run` (W10.7). faster-whisper is the STT engine;
# sounddevice + numpy handle mic capture + the float32 array Whisper
# expects. None of these are imported until `cs voice` actually runs.
voice = [
  "faster-whisper>=1.0",
  "sounddevice>=0.4",
  "numpy>=1.24",
]
# `pip install claudestruct[mutation]` to run the W5.7 nightly
# mutation-testing job locally. The CI workflow installs this same
# extra; not part of the default install because mutmut pulls in
# parso + a handful of utilities that double the wheel cache for
# every contributor who never runs the mutation suite.
mutation = [
  "mutmut>=2.4",
]
# `pip install claudestruct[secrets-aws]` enables the AWS Secrets
# Manager backend in `claudestruct.secrets`. boto3 is heavy (~30 MB
# of botocore data) so it's opt-in. Operators that wire the
# `aws-secrets` provider in CLAUDESTRUCT_SECRETS_PROVIDER pull this in.
secrets-aws = [
  "boto3>=1.34",
]
# `pip install claudestruct[kms-aws]` enables the AWS KMS provider in
# `claudestruct.server.crypto` for envelope-encryption (W8.6 CMEK).
# Same boto3 dep as `secrets-aws` so installing both is free.
kms-aws = [
  "boto3>=1.34",
]
# `pip install claudestruct[kms-gcp]` enables the GCP KMS provider.
# google-cloud-kms is the official Google client; auth uses
# Application Default Credentials.
kms-gcp = [
  "google-cloud-kms>=2.20",
]
# `pip install claudestruct[secrets-vault]` enables the HashiCorp
# Vault KV-v2 backend. hvac is light but unrelated to most installs.
secrets-vault = [
  "hvac>=2.1",
]

[project.scripts]
cs = "claudestruct.cli:main"
claudestruct = "claudestruct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claudestruct = ["py.typed"]

# --- W5.7 — Test rigor ----------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["site", "dist", "build", ".venv", ".pytest_cache"]

[tool.ruff.lint]
# Error-only categories. F = pyflakes (unused imports, undefined names),
# E/W = pycodestyle errors+warnings, I = isort, B = bugbear (likely
# bugs), UP = pyupgrade (modernization), SIM = simplify (dead code).
# Skipping ANN/D/PT/etc -- prefer signal over noise on a small codebase.
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",   # line-too-long; handled by formatter, not blocking
  "B008",   # function call in default arg; click decorators legit use this
  "SIM103", # explicit `if cond: return True / return False` reads more clearly
  "SIM105", # `try/except/pass` is fine; `contextlib.suppress` adds an import
  "SIM108", # ternary preference is opinionated
  "UP045",  # `Optional[X]` -> `X | None` -- noisy on existing files
  "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F841"]  # asserts in tests are fine

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["claudestruct"]
branch = true
omit = [
  # CLI entry points: covered by manual smoke + CI invocations rather
  # than unit tests. Excluded from the gate so library code drives the
  # number.
  "src/claudestruct/cli.py",
  "src/claudestruct/mcp_server.py",
  "src/claudestruct/server/cli.py",
]

[tool.coverage.report]
# Floor of 70% for the draft -- bumps to 80% after W5.1 OTel adds the
# tracing module's tests.
fail_under = 70
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# --- Mutation testing (W5.7 follow-up) -----------------------------
#
# Nightly job in .github/workflows/mutation.yml runs mutmut against
# the modules listed below. Started narrow (billing.py + prompts.py)
# so the first run completes inside a single GitHub Actions slot;
# expand the list as the suite hardens. We are NOT gating CI on the
# mutation score yet — the job collects signal so we can tune the
# `--paths-to-mutate` set and the kill-rate floor before failing
# anything.
[tool.mutmut]
paths_to_mutate = "src/claudestruct/server/billing.py,src/claudestruct/prompts.py"
runner = "python -m pytest -x -q tests/test_billing.py tests/test_prompts.py"
tests_dir = "tests/"
backup = false
