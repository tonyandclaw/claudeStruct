[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudestruct-sdk"
version = "0.0.1a0"
description = "Pre-stable Python client for the claudeStruct REST API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/tonyandclaw/claudeStruct"
Repository = "https://github.com/tonyandclaw/claudeStruct"
Issues = "https://github.com/tonyandclaw/claudeStruct/issues"

[tool.setuptools.packages.find]
where = ["src"]
