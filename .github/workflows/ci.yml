name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Production-readiness — fail the workflow on any committed
  # secret. gitleaks runs first because it's the cheapest gate
  # and the consequences of leaking a credential are 1000× worse
  # than any test failure. `--no-git` keeps the run reproducible
  # in PR mode (don't depend on remote history).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action requires a GITLEAKS_LICENSE for org accounts.
    # Personal accounts (this repo) run free, but if the env is
    # mid-migration or the action throws on first-run we don't
    # want to block the entire CI matrix on it. continue-on-error
    # surfaces failures in the run summary without gating merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so gitleaks can scan every commit
          # the PR introduces (default fetch-depth=1 only sees
          # the merge commit).
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          # Install the [server] extra so the cs-serve / RBAC test
          # module actually runs in CI (it pytest.importorskips out
          # otherwise). Lean-install verification is a separate concern.
          python -m pip install -e '.[server]'
          python -m pip install pytest coverage ruff
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Run pytest with coverage gate
        run: |
          python -m coverage run -m pytest tests/
          python -m coverage report

  typescript:
    name: TypeScript / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    defaults:
      run:
        working-directory: claw-squad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: claw-squad/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test

  go:
    name: Go (claw-sandbox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claw-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
